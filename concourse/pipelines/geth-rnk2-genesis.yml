---
resources:
  - name: ci-shared
    type: git
    icon: github
    source:
      uri: https://github.com/Reactive-Network/ci.git
      branch: master
      paths:
        - concourse/
      username: ((github-access-token.username))
      password: ((github-access-token.password))
    check_every: 1m

  - name: app-git
    type: git
    icon: github
    source:
      uri: https://github.com/Reactive-Network/geth-rnk2-genesis.git
      branch: origin-rnk
      username: ((github-access-token.username))
      password: ((github-access-token.password))
    webhook_token: ((webhook-token-geth-rnk2-genesis))
    check_every: 1m

  - name: app-git-concourse
    type: git
    icon: github
    source:
      uri: https://github.com/Reactive-Network/geth-rnk2-genesis.git
      branch: origin-rnk
      paths:
        - concourse/**
      submodules: none
      username: ((github-access-token.username))
      password: ((github-access-token.password))
    webhook_token: ((webhook-token-geth-rnk2-genesis))
    check_every: 1m

  - name: builder-image
    type: registry-image
    source:
      repository: ghcr.io/reactive-network/ci-image
      tag: builder-1d296957
      username: ((ghcr-credentials.username))
      password: ((ghcr-credentials.password))

groups:
  - name: meta
    jobs:
      - set-self
  - name: ci
    jobs:
      - lint
      - test

jobs:
  - name: set-self
    plan:
      - in_parallel:
          - get: app-git-concourse
            trigger: true
          - get: ci-shared
            trigger: true
      - task: render-and-validate
        file: ci-shared/concourse/tasks/render-and-validate.yml
        input_mapping:
          pipeline-src: app-git-concourse
          ci-shared: ci-shared
        output_mapping:
          rendered: rendered
        params:
          PIPELINE_NAME: geth-rnk2-genesis
          PIPELINE_SRC_PATH: pipeline-src/concourse/pipelines/geth-rnk2-genesis.yml
          VARS_FILE: pipeline-src/concourse/vars/sample.yml
          CI_RESOURCE: ci-shared
      - set_pipeline: self
        file: rendered/pipeline.yml

  - name: lint
    plan:
      - in_parallel:
          steps:
            - get: app-git
              trigger: true
            - get: ci-shared
              passed: [set-self]
            - get: builder-image
      - task: lint
        image: builder-image
        file: app-git/concourse/tasks/lint.yml
        input_mapping:
          app-git: app-git

  - name: test
    plan:
      - in_parallel:
          steps:
            - get: app-git
              passed: [lint]
              trigger: true
            - get: ci-shared
              passed: [set-self]
            - get: builder-image
      - task: test
        image: builder-image
        file: app-git/concourse/tasks/test.yml
        input_mapping:
          app-git: app-git
